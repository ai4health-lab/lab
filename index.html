<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站迁移通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .notification {
            background-color: #ffcc00;
            padding: 20px;
            border-radius: 5px;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="notification">
        <h1>网站已迁移至新地址</h1>
        <p>感谢访问！我们的网站已迁移到新的地址，请访问 <a href="http://maolab.tech/lab" target="_blank">新网址</a> 获取更多信息。</p>
        <p>谢谢您的支持！</p>
    </div>
</body>
</html>
